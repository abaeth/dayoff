<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ใช้งาน Google Apps Script ผ่าน GitHub</title>
</head>
<body>
    <h1>ทดสอบเรียกข้อมูลจาก Google Apps Script</h1>
    <button id="loadDataBtn">ดึงข้อมูล</button>
    <div id="result" style="margin-top: 20px; color: blue;"></div>

    <script>
        // เอา URL /exec ของคุณมาใส่ที่นี่
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbzzh8AxVE4gW8WN5OTi4c3no3g52Skbcm85rcsq45amr9pkzD8pj089L2kIyCHhYM5Kxw/exec';

        document.getElementById('loadDataBtn').addEventListener('click', () => {
            document.getElementById('result').innerText = "กำลังโหลดข้อมูล...";
            
            fetch(scriptUrl)
                .then(response => response.text()) // หรือ response.json() ถ้า Apps script ส่งคืนมาเป็น JSON
                .then(data => {
                    document.getElementById('result').innerText = "ผลลัพธ์: " + data;
                })
                .catch(error => {
                    document.getElementById('result').innerText = "เกิดข้อผิดพลาด: " + error;
                });
        });
    </script>
</body>
</html>
