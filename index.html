    <style>
        /* ลบขอบและทำให้ iframe เต็มหน้าจอพอดี */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f2f2f7; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>
    
    <!-- ปล่อย src ให้ว่างไว้ก่อน เดี๋ยว JavaScript จะนำลิงก์มาใส่ให้พร้อมแนบพารามิเตอร์ -->
    <iframe id="app-frame" allow="autoplay; camera; fullscreen"></iframe>

    <script>
        // ลิงก์ Google Apps Script ของคุณ
        const GAS_EXEC_URL = "https://script.google.com/macros/s/AKfycbwRFQ57hEjFnACdw93BMS2sTp3fzpkO2EhpsedFGQ-AiN0BkNvydZr_bj7EhysNHzTy/exec?page=operation";

        // 🔒 ล็อคชื่อ Title บนเบราว์เซอร์
        document.title = "แอ๊บแอ้";
        setInterval(function() {
            document.title = "แอ๊บแอ้";
        }, 1000);

        // โหลดแอปเมื่อหน้าเว็บพร้อม
        window.onload = function() {
            loadApp();
        };

        function loadApp() {
            // ดึงค่าการล็อกอินจากเครื่อง
            let savedName = localStorage.getItem("holiday_name");
            let savedId = localStorage.getItem("holiday_id");
            let savedEmail = localStorage.getItem("holiday_email");

            let targetUrl = GAS_EXEC_URL;

            // ถ้ามีประวัติการล็อกอิน ให้แนบพารามิเตอร์ส่งไปให้ Apps Script ด้วย
            if (savedName && savedId) {
                // ใช้ & ต่อท้ายเพราะ URL เดิมมี ?page=operation อยู่แล้ว
                targetUrl += "&name=" + encodeURIComponent(savedName) + 
                             "&id=" + encodeURIComponent(savedId) + 
                             "&email=" + encodeURIComponent(savedEmail || '');
            }

            // นำลิงก์ไปใส่ใน iframe พร้อมใส่ _nocache เพื่อป้องกันการดึงหน้าเก่ามาแสดง
            document.getElementById("app-frame").src = targetUrl + "&_nocache=" + Date.now();
        }

        // 📩 รอรับคำสั่ง (PostMessage) จากฝั่ง Google Apps Script
        window.addEventListener("message", function(event) {
            if (event.data && event.data.action) {
                // เมื่อรับคำสั่งเซฟข้อมูลล็อกอิน
                if (event.data.action === "save_login") {
                    localStorage.setItem("holiday_name", event.data.name);
                    localStorage.setItem("holiday_id", event.data.id);
                    localStorage.setItem("holiday_email", event.data.email);
                } 
                // เมื่อรับคำสั่งออกจากระบบ
                else if (event.data.action === "logout") {
                    localStorage.removeItem("holiday_name");
                    localStorage.removeItem("holiday_id");
                    localStorage.removeItem("holiday_email");
                    loadApp(); // รีเฟรช iframe ใหม่
                }
            }
        });
    </script>
</body>
